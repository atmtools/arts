dependencies:
        - make
        - cmake
        - docutils
        - eigen
        - fast_float
        - fftw
        - ipykernel
        - lark-parser
        - libboost-devel
        - libcxx
        - llvm-openmp < 21
        - matplotlib<3.12
        - nanobind<=2.13
        - nbsphinx
        - netcdf4
        - ninja
        - numpy>=2
        # 0.3.34 win-64 builds corrupt their stack in the DGEMM kernel on AMD
        # Zen 4/5 CPUs that expose AVX-512 (OpenMathLib/OpenBLAS#6013, fixed
        # upstream by OpenMathLib/OpenBLAS#6014, but not yet in a conda-forge
        # build: conda-forge/openblas-feedstock#196).  It shows up as random
        # segfaults in large LAPACK/BLAS calls, e.g. in the VDISORT tests.
        - openblas<0.3.34
        - pip
        - pkg-config
        - python-build
        - requests
        - scipy
        - setuptools>=77
        - sphinx=8.2.3
        - sphinx-copybutton
        - sphinx-favicon
        - sphinx-rtd-theme=3
        - sphinx-sitemap
        - sphinxcontrib-jquery
        - sphinxcontrib-bibtex
        - tqdm
        - xarray
        - zlib
channels:
        - conda-forge
        - nodefaults
